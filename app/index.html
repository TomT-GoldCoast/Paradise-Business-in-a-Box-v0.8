<div class="app-shell paradise-production-shell">

        <a class="top-contact" href="tel:7723239401">☎ 772-323-9401</a>
        <span class="sync"><i></i> Connected</span>
        <button class="tiny" id="logoutBtn">Sign out</button>
        <div class="avatar" id="avatar">P</div>
      </div>
    </header>
    <section id="content" class="content"><div class="loading">Loading workspace…</div></section>
  </main>
</div>
<div id="modalRoot"></div><div id="toastRoot" class="toast-root"></div>
