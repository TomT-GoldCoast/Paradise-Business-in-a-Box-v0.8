<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07130d"><title>Paradise Lawn Care — Sign In</title><link rel="stylesheet" href="/app/assets/styles.css?v=0.8.3"><style>
.login-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#123220 0,#07130d 45%,#030705 100%)}.login-card{width:min(520px,100%);background:#0b1510;border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:28px;box-shadow:0 25px 80px rgba(0,0,0,.45)}.login-logo{display:block;max-width:260px;max-height:150px;object-fit:contain;margin:0 auto 14px}.login-card h1{text-align:center;margin:4px 0 6px}.login-card>p{text-align:center;color:#a8b5ad;margin:0 0 22px}.login-card form{display:grid;gap:14px}.login-card .field input{width:100%}.login-note{font-size:.86rem;color:#8f9b94;text-align:center;margin-top:14px}.login-error{min-height:22px;color:#ff9a7d;text-align:center;margin-top:10px}.setup-banner{padding:12px;border:1px solid rgba(92,255,0,.25);border-radius:12px;background:rgba(92,255,0,.06);margin-bottom:16px;color:#ccebc0}.hidden{display:none!important}
</style></head><body><main class="login-shell"><section class="login-card"><img class="login-logo" src="/app/assets/paradise-logo-master.png" alt="Paradise Lawn Care"><h1 id="loginTitle">Secure Sign In</h1><p id="loginSubtitle">Owner, office, crew and customer accounts use individual credentials.</p><div id="setupBanner" class="setup-banner hidden">First-time setup: create the Owner account. No default password is built into the program.</div><form id="loginForm"><label class="field"><span>Username or email</span><input name="username" autocomplete="username" required></label><label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" minlength="10" required></label><label class="field hidden" id="nameField"><span>Owner name</span><input name="name" value="Brandon Pecci"></label><button class="btn primary" id="submitBtn">Sign In</button></form><div class="login-error" id="error"></div><div class="login-note">Paradise Lawn Care of the Treasure Coast LLC · Combo Web and App</div></section></main><script type="module" src="/app/login.js?v=0.8.3"></script></body></html>
